<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HyperLocal-AI: Universal Emergency Triage</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    #map { height: 420px; width: 100%; border-radius: 0.75rem; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">

  <header class="bg-slate-800 border-b border-slate-700 py-4 px-6 flex justify-between items-center shadow-lg">
    <div class="flex items-center gap-3">
      <span class="text-2xl">🚨</span>
      <h1 class="text-xl font-bold text-red-500">HyperLocal-AI <span class="text-xs bg-red-950 text-red-400 border border-red-800 px-2 py-0.5 rounded-full ml-2">Pan-India Geo-Engine</span></h1>
    </div>
  </header>

  <main class="flex-1 max-w-6xl w-full mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-2 gap-6">

    <div class="flex flex-col gap-5">
      <div class="bg-slate-800/80 border border-slate-700 rounded-xl p-5">
        <h2 class="text-lg font-semibold text-slate-200 mb-2">🎙️ Voice Emergency Report</h2>
        <p class="text-xs text-slate-400 mb-4">Speak any location (e.g. "High waterlogging near Dum Dum station" or "Tree fallen in Gariahat").</p>
        
        <div class="flex items-center gap-3">
          <button id="micBtn" onclick="toggleSpeech()" class="flex-1 bg-red-600 hover:bg-red-700 text-white font-medium py-3 px-4 rounded-lg flex items-center justify-center gap-2">
            <span id="micText">🎤 Start Voice Report</span>
          </button>
          <button onclick="simulateDemo('High waterlogging near Dum Dum station')" class="bg-amber-600 hover:bg-amber-500 text-white font-medium py-3 px-3 rounded-lg text-xs">
            ⚡ Test Dum Dum
          </button>
        </div>
        <p id="speechStatus" class="text-xs text-amber-400 mt-2 h-4 italic font-mono"></p>
      </div>

      <div class="bg-slate-800/80 border border-slate-700 rounded-xl p-4">
        <label class="text-xs font-semibold text-slate-400 uppercase block mb-1">Captured Audio Transcript</label>
        <p id="transcriptBox" class="text-sm text-slate-300 italic bg-slate-900 p-3 rounded-md min-h-[50px] border border-slate-800">
          Waiting for voice input...
        </p>
      </div>

      <div class="bg-slate-800/80 border border-slate-700 rounded-xl p-5 flex-1">
        <div class="flex justify-between items-center border-b border-slate-700 pb-3 mb-3">
          <h3 class="text-md font-bold text-slate-200">📄 Dispatch Ticket</h3>
          <span id="priorityBadge" class="text-xs font-bold px-2.5 py-1 rounded bg-slate-700 text-slate-400">PENDING</span>
        </div>
        <div class="space-y-3 text-sm">
          <div><span class="text-xs text-slate-400 block">Hazard:</span> <span id="hazardType" class="font-semibold">--</span></div>
          <div><span class="text-xs text-slate-400 block">Location Detected:</span> <span id="detectedLocation" class="font-medium text-amber-300">--</span></div>
        </div>
      </div>
    </div>

    <div class="bg-slate-800/80 border border-slate-700 rounded-xl p-5 flex flex-col">
      <h2 class="text-md font-semibold text-slate-200 mb-3">🗺️ Live Incident Map Navigation</h2>
      <div id="map" class="shadow-inner border border-slate-700"></div>
    </div>

  </main>

  <script>
    let map = L.map('map').setView([22.5726, 88.4331], 12);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

    let activeMarker = null;
    let recognition;
    let isListening = false;

    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      recognition = new SpeechRecognition();
      recognition.continuous = false;
      recognition.lang = 'hi-IN';

      recognition.onstart = () => {
        isListening = true;
        document.getElementById('micText').innerText = "Listening...";
        document.getElementById('speechStatus').innerText = "Speak now...";
      };

      recognition.onresult = (event) => {
        const text = event.results[0][0].transcript;
        document.getElementById('transcriptBox').innerText = `"${text}"`;
        processReport(text);
      };

      recognition.onend = () => {
        isListening = false;
        document.getElementById('micText').innerText = "🎤 Start Voice Report";
      };
    }

    function toggleSpeech() {
      if (isListening) recognition.stop();
      else recognition.start();
    }

    function simulateDemo(text) {
      document.getElementById('transcriptBox').innerText = `"${text}"`;
      processReport(text);
    }

    async function processReport(text) {
      document.getElementById('speechStatus').innerText = "Searching location...";

      let hazard = "Severe Waterlogging";
      let priority = "P2 HIGH";
      let pColor = "bg-orange-600 text-white";

      if (text.toLowerCase().includes("wire") || text.toLowerCase().includes("fire")) {
        priority = "P1 CRITICAL";
        pColor = "bg-red-600 text-white animate-pulse";
        hazard = "Live Wire Hazard";
      }

      document.getElementById('hazardType').innerText = hazard;
      document.getElementById('priorityBadge').innerText = priority;
      document.getElementById('priorityBadge').className = `text-xs font-bold px-2.5 py-1 rounded ${pColor}`;

      // Clean search text
      let query = text.toLowerCase()
        .replace("high", "").replace("severe", "").replace("waterlogging", "")
        .replace("water", "").replace("near", "").replace("in", "").replace("gira hai", "").trim();

      if (!query.includes("kolkata") && !query.includes("india")) {
        query += " Kolkata";
      }

      document.getElementById('detectedLocation').innerText = query.toUpperCase();

      try {
        const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}`);
        const data = await res.json();

        if (data && data.length > 0) {
          const lat = parseFloat(data[0].lat);
          const lon = parseFloat(data[0].lon);
          plotMarker(lat, lon, hazard, priority, data[0].display_name);
        } else {
          // Hardcoded backup for Dum Dum if search fails
          if (query.includes("dum dum")) {
            plotMarker(22.6221, 88.4215, hazard, priority, "Dum Dum Station Area, Kolkata");
          } else {
            plotMarker(22.5726, 88.4331, hazard, priority, "Default Location");
          }
        }
      } catch(e) {
        plotMarker(22.6221, 88.4215, hazard, priority, "Dum Dum Station, Kolkata");
      }
      document.getElementById('speechStatus').innerText = "Marker Updated!";
    }

    function plotMarker(lat, lng, hazard, priority, addr) {
      if (activeMarker) map.removeLayer(activeMarker);

      map.flyTo([lat, lng], 15, { duration: 1.5 });

      activeMarker = L.circleMarker([lat, lng], {
        color: priority.includes("P1") ? '#ef4444' : '#f97316',
        fillColor: priority.includes("P1") ? '#ef4444' : '#f97316',
        fillOpacity: 0.9,
        radius: 15
      }).addTo(map);

      activeMarker.bindPopup(`<b>${priority}</b><br>${hazard}<br><small>${addr}</small>`).openPopup();
    }
  </script>
</body>
</html>
