<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Voice Map Tracker</title>
    
    <!-- Leaflet CSS (Free Interactive Map) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #0f172a;
            color: #f8fafc;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #1e293b;
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
        h2 {
            margin-top: 0;
            color: #38bdf8;
        }
        .instructions {
            background: #334155;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 20px;
        }
        .controls {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }
        button {
            padding: 12px 24px;
            background-color: #0284c7;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
        }
        button:hover {
            background-color: #0369a1;
            transform: translateY(-1px);
        }
        #status {
            font-weight: 600;
            color: #94a3b8;
        }
        #transcription {
            padding: 14px;
            background: #0f172a;
            border-left: 4px solid #38bdf8;
            border-radius: 6px;
            margin-bottom: 15px;
            font-size: 15px;
            min-height: 48px;
        }
        #map {
            height: 500px;
            width: 100%;
            border-radius: 12px;
            border: 2px solid #334155;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>🌊 Universal Waterlogging Voice Tracker</h2>
    
    <div class="instructions">
        <b>Kaise Bolein:</b> "Waterlogging near Howrah Bridge", "Heavy rain at Connaught Place Delhi", ya "Flooding near Marine Drive Mumbai".
    </div>
    
    <div class="controls">
        <button id="start-btn">🎤 Voice Input Shuru Karein</button>
        <span id="status">Status: Ready</span>
    </div>

    <div id="transcription">Speech Output: <i>(Aapki aawaz yahan text mein dikhegi)</i></div>

    <div id="map"></div>
</div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
    // 1. Initial Map Setup (Default: Kolkata Sector 5)
    let currentLat = 22.5726;
    let currentLng = 88.4311;
    
    const map = L.map('map').setView([currentLat, currentLng], 13);

    // OpenStreetMap Free Tile Layer
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    let currentMarker = L.marker([currentLat, currentLng])
        .addTo(map)
        .bindPopup("<b>Default Location:</b> Sector 5, Salt Lake")
        .openPopup();

    // 2. Speech Recognition Setup
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (!SpeechRecognition) {
        alert("Aapka browser Speech Recognition support nahi karta. Please Google Chrome use karein.");
    } else {
        const recognition = new SpeechRecognition();
        recognition.lang = 'en-IN'; // Indian English accent Support
        recognition.interimResults = false;

        const startBtn = document.getElementById('start-btn');
        const statusEl = document.getElementById('status');
        const transEl = document.getElementById('transcription');

        startBtn.addEventListener('click', () => {
            try {
                recognition.start();
                statusEl.innerText = "Status: Sun raha hoon...";
                statusEl.style.color = "#f43f5e"; // Red
            } catch (e) {
                console.log("Already listening...");
            }
        });

        recognition.onresult = async (event) => {
            const spokenText = event.results[0][0].transcript;
            transEl.innerHTML = `<b>Aapne Bola:</b> "${spokenText}"`;
            
            statusEl.innerText = "Status: Location trace ho rahi hai...";
            statusEl.style.color = "#38bdf8"; // Blue

            await processVoiceAndMoveMap(spokenText);
        };

        recognition.onerror = (event) => {
            statusEl.innerText = `Status: Error (${event.error})`;
            statusEl.style.color = "#f43f5e";
        };

        recognition.onend = () => {
            if (statusEl.innerText.includes("Sun raha hoon")) {
                statusEl.innerText = "Status: Ready";
                statusEl.style.color = "#94a3b8";
            }
        };
    }

    // 3. Universal Location Processor & Geocoder
    async function processVoiceAndMoveMap(fullText) {
        let locationQuery = fullText.toLowerCase();

        // Voice Command se main Location keywords extract karna
        const keywords = ["near", "at", "in", "around", "towards"];
        for (let kw of keywords) {
            if (locationQuery.includes(kw)) {
                locationQuery = locationQuery.split(kw)[1].trim();
                break;
            }
        }

        console.log("Searching Location:", locationQuery);

        try {
            // First Attempt: Global Search (Works for any location worldwide)
            let apiUrl = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(locationQuery)}`;
            let response = await fetch(apiUrl);
            let data = await response.json();

            // Fallback Attempt: Agar directly nahi mil raha toh West Bengal/Kolkata add karke try karein
            if (!data || data.length === 0) {
                apiUrl = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(locationQuery + " West Bengal")}`;
                response = await fetch(apiUrl);
                data = await response.json();
            }

            if (data && data.length > 0) {
                const lat = parseFloat(data[0].lat);
                const lon = parseFloat(data[0].lon);
                const displayName = data[0].display_name;

                // Purana Marker Hatao
                if (currentMarker) {
                    map.removeLayer(currentMarker);
                }

                // Map ko smoothly target location par zoom karein
                map.flyTo([lat, lon], 16, {
                    animate: true,
                    duration: 1.8
                });

                // Clear Marker with Information
                currentMarker = L.marker([lat, lon])
                    .addTo(map)
                    .bindPopup(`
                        <div style="color: #0f172a;">
                            <b style="color: #d97706;">⚠️ Reported Waterlogging Spot</b><br>
                            <b>Location:</b> ${displayName.split(',')[0]}<br>
                            <small>${displayName}</small>
                        </div>
                    `)
                    .openPopup();

                document.getElementById('status').innerText = "Status: Location Traced Successfully! ✅";
                document.getElementById('status').style.color = "#22c55e"; // Green
            } else {
                document.getElementById('status').innerText = "Status: Location nahi mili! Doobara bolein. ❌";
                document.getElementById('status').style.color = "#f59e0b"; // Orange
            }
        } catch (error) {
            console.error("Geocoding Error:", error);
            document.getElementById('status').innerText = "Status: API Connection Error ⚠️";
            document.getElementById('status').style.color = "#f43f5e";
        }
    }
</script>

</body>
</html>
